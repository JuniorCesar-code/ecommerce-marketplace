# PostgreSQL (lokale Entwicklung)
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace_db
spring.datasource.username=marketplace_user
spring.datasource.password=${DB_PASSWORD}


# Flyway: im dev-Profil zusätzlich Testdaten aus db/dev-data laden
spring.flyway.locations=classpath:db/migration,classpath:db/dev-data