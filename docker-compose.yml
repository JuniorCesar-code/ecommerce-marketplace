services:
  postgres:
    image: postgres:17
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data

volumes:
  marketplace_postgres_data::